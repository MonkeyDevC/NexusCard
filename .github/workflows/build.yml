name: Build and Release

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\nexuscard.iss "/DAppVersion=$version" "/DExePath=..\target\release\nexuscard.exe"
          Copy-Item target\release\nexuscard.exe installer\Output\nexuscard.exe
          Get-ChildItem installer\Output\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii installer\Output\SHA256SUMS.txt
          }
          Get-Content installer\Output\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nexuscard-windows
          path: installer/Output/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/NexusCard-Setup-*.exe
            installer/Output/nexuscard.exe
            installer/Output/SHA256SUMS.txt
          generate_release_notes: true
