[package]
name = "nexuscard"
version = "1.3.0"
edition = "2024"
description = "NexusCard: customize Apple Wallet card designs from Windows"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
ed25519-dalek = "3"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
miniz_oxide = "0.8"
open = "5"
plist = "1"
regex = "1"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
